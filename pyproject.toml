[build-system]
requires = ["setuptools==82.0.1"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-urgency-engine"
version = "0.1.0"
description = "Deterministic deadline urgency forecast core"
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = "Apache-2.0"
license-files = ["LICENSE"]

[tool.setuptools]
packages = ["urgency_engine", "scripts"]
