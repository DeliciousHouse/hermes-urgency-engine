# No [build-system] table on purpose: Hermes treats a pyproject that builds and installs
# nothing as no dependency declaration, so the native plugin never joins the shared
# environment. `pip install .` still builds the library with the default setuptools backend.
[project]
name = "hermes-urgency-engine"
version = "0.1.0"
description = "Deterministic deadline urgency forecast core"
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = "Apache-2.0"
license-files = ["LICENSE"]

[tool.setuptools]
packages = ["urgency_engine"]
