name: hermes-urgency-engine
version: 0.1.0
description: Local audited commitments, byte-identity progress and scoped pre-turn urgency guidance
license: Apache-2.0
homepage: https://github.com/DeliciousHouse/hermes-urgency-engine
requires_hermes: ">=0.23.2"
provides_tools:
  - urgency_query
provides_hooks:
  - pre_llm_call
  - on_session_end
  - on_session_reset
  - post_tool_call
config_schema:
  context_enabled:
    type: bool
    default: true
    description: Include advisory urgency guidance before model turns
  context_max_chars:
    type: int
    default: 4000
    description: Maximum guidance characters (512 to 8000)
  default_project:
    type: str
    default: ""
    description: Explicit project fallback in this profile; empty disables fallback
  artifact_root:
    type: str
    default: ""
    description: Existing absolute directory for local byte checks; empty uses plugin-data artifacts
  diagnostic_log_bytes:
    type: int
    default: 1048576
    description: Local redacted diagnostic rotation size (65536 to 4194304 bytes)
  watchdog_enabled:
    type: bool
    default: false
    description: Enable hook observations and explicit ticks; install also activates monitoring
  watchdog_normal_seconds:
    type: int
    default: 300
    description: Normal scan interval, 60 to 3600 seconds
  watchdog_risk_seconds:
    type: int
    default: 60
    description: High-risk scan interval, 60 to 300 seconds and no greater than normal
  watchdog_stall_seconds:
    type: int
    default: 1800
    description: Running without verified progress threshold, 60 to 86400 seconds
  watchdog_claim_seconds:
    type: int
    default: 900
    description: Claim or heartbeat age threshold, 60 to 86400 seconds
  watchdog_notice_limit:
    type: int
    default: 3
    description: Maximum generated notices per episode, 1 to 10
  watchdog_retention_days:
    type: int
    default: 30
    description: Old observation and resolved episode retention, 1 to 365 days
  watchdog_max_rows:
    type: int
    default: 10000
    description: Retained monitor row cap, 100 to 100000; active and replay data never evicted
