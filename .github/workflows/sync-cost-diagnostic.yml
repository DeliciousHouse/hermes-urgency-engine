name: Sync cost diagnostic (not acceptance)

on:
  push:
    branches-ignore: [main]
    paths:
      - '.github/workflows/sync-cost-diagnostic.yml'
      - 'tests/diagnose_sync_cost.py'

permissions:
  contents: read

jobs:
  measure:
    name: Disk timing (Windows, Python ${{ matrix.python }})
    runs-on: windows-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.14.10']
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: 39bc413fa8331c4c8ad59c5708e9c924b1b64c55
          path: .diagnostic/failed
          persist-credentials: false
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: b1400ec4058fde36a51e8c52479a1f858bc83d15
          path: .diagnostic/comparator
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ matrix.python }}
      - name: Compare fresh, unchanged and reopened disk stores
        shell: bash
        run: |
          set -euo pipefail
          for rows in 100 1000; do
            for revision in comparator failed; do
              printf 'REVISION=%s ROWS=%s MONITOR=false\n' "$revision" "$rows"
              python tests/diagnose_sync_cost.py --source ".diagnostic/$revision" --rows "$rows"
            done
          done
          for revision in comparator failed; do
            printf 'REVISION=%s ROWS=100 MONITOR=true\n' "$revision"
            python tests/diagnose_sync_cost.py --source ".diagnostic/$revision" --rows 100 --monitor
          done
